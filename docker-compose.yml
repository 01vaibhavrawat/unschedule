services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unschedule-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --loop asyncio --reload
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://smartwire:smartwire@etd-shard-00-00.nvgep.mongodb.net:27017,etd-shard-00-01.nvgep.mongodb.net:27017,etd-shard-00-02.nvgep.mongodb.net:27017/?replicaSet=atlas-rciogd-shard-0&ssl=true&authSource=admin&retryWrites=true&w=majority&appName=ETD}
      - JWT_SECRET=${JWT_SECRET:-unschedule-super-secret-jwt-key-change-in-production-2026}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_DAYS=7
      - CORS_ORIGINS=${CORS_ORIGINS:-https://moola.guide,https://www.moola.guide,http://moola.guide,http://www.moola.guide,http://localhost:3000,http://localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6Jlb7dst5BKtzCBL-snfD5K7eHm_IyZKhjpOP_swwKwJQ}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
    container_name: unschedule-frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/backend}
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

  redis:
    image: redis:7-alpine
    container_name: unschedule-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: unschedule-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
