version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: unschedule-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unschedule-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/unschedule
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_here}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_DAYS=7
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6Jlb7dst5BKtzCBL-snfD5K7eHm_IyZKhjpOP_swwKwJQ}
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
    container_name: unschedule-frontend
    ports:
      - "80:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/backend}
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
