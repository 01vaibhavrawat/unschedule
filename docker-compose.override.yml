services:
  frontend:
    # Use a lightweight node image directly for local development
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    
    # Override the command to install dependencies (if missing) and start the dev server
    command: >
      sh -c "npm install && npm run dev"
    
    environment:
      - NODE_ENV=development
      # Next.js needs to bind to all network interfaces inside the container
      - HOSTNAME=0.0.0.0
      
    volumes:
      # Map your local frontend directory to the container for live reloading
      - ./frontend:/app
      
      # Exclude node_modules and .next from the host machine to avoid OS/binary conflicts
      # These will be stored in anonymous Docker volumes instead
      - /app/node_modules
      - /app/.next
